<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 196" width="400" height="196">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    .card { fill: url(#wash); stroke: #30363d; }
    .icon-box { fill: #a78bfa; fill-opacity: 0.12; stroke: #a78bfa; stroke-opacity: 0.4; }
    .icon { fill: none; stroke: #a78bfa; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-2px); } }
    .title { font-size: 17px; font-weight: 600; fill: #e6edf3; }
    .kind { font-size: 10px; fill: #a78bfa; letter-spacing: 1.5px; }
    .desc { font-size: 13px; fill: #8b949e; }
    .tag { font-size: 11px; fill: #8b949e; }
    .arrow { fill: none; stroke: #a78bfa; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
  <radialGradient id="wash" cx="0" cy="0" r="1">
  <stop offset="0" stop-color="#a78bfa" stop-opacity="0.14"/>
  <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a78bfa"/>
  <stop offset="1" stop-color="#60a5fa"/>
  </linearGradient>
  </defs>
  <g transform="translate(8, 8)">
  <rect x="0.5" y="0.5" width="383" height="179" rx="12" class="card"/>
  <rect x="0" y="24" width="3" height="132" rx="1.5" fill="url(#edge)"/>
  <rect x="24" y="24" width="32" height="32" rx="8" class="icon-box"/>
  <path d="M31 37 V43 M35.5 33 V47 M40 30 V50 M44.5 34 V46 M49 37 V43" class="icon float"/>
  <text x="72" y="39" class="sans title">Audict</text>
  <text x="72" y="56" class="mono kind">FULL-STACK AI</text>
  <text x="24" y="92" class="sans desc">Call-audit platform for QA teams: Whisper transcripts</text>
  <text x="24" y="112" class="sans desc">and Llama 3.3 scoring via Groq, with JWT-protected</text>
  <text x="24" y="132" class="sans desc">audio streaming.</text>
  <circle cx="28" cy="152" r="4" fill="#009688"/><text x="38" y="156" class="mono tag">FastAPI</text><circle cx="106" cy="152" r="4" fill="#61dafb"/><text x="116" y="156" class="mono tag">React</text><circle cx="171" cy="152" r="4" fill="#336791"/><text x="181" y="156" class="mono tag">PostgreSQL</text>
  <path d="M350 158 L360 148 M352.5 148 H360 V155.5" class="arrow"/>
