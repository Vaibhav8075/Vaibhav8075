  <path d="M30 38 A 12 12 0 0 1 50 38 M34 42 A 7 7 0 0 1 46 42" class="icon"/>
  </g>
  <text x="90" y="42" class="sans title">IoT Fire Detection</text>
  <text x="90" y="60" class="mono kind">IOT · ML</text>
  <text x="762" y="40" text-anchor="end" class="mono index">03/05</text>
  <text x="90" y="88" class="sans desc">ESP32-S3 sensor fusion and a Random Forest (94.9% test accuracy, 367k real readings) built to</text>
