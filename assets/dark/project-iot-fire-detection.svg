<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 176" width="800" height="176">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    .panel { fill: #161b22; stroke: #30363d; }
    .icon-box { fill: none; stroke: #30363d; }
    .icon { fill: none; stroke: #f0f6fc; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .title { font-size: 18px; font-weight: 600; fill: #f0f6fc; }
    .kind { font-size: 10px; fill: #4493f8; letter-spacing: 1.5px; font-weight: 700; }
    .index { font-size: 10px; fill: #8b949e; letter-spacing: 1px; }
    .desc { font-size: 14px; fill: #8b949e; }
    .tag { font-size: 11px; fill: #8b949e; }
    .arrow { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="14.5" y="0.5" width="771" height="163" rx="12" class="panel"/>
  <g transform="translate(14, 4)">
