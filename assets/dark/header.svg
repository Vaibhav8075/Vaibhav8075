<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 228" width="800" height="228">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    .name { font-size: 42px; font-weight: 700; fill: url(#chrome); letter-spacing: -1px; }
    .role { font-size: 13px; fill: #8b949e; letter-spacing: 2px; }
    .tagline { font-size: 14px; fill: #8b949e; }
    .chip { fill: #21262d; stroke: #30363d; }
    .chip-text { font-size: 10px; fill: #8b949e; letter-spacing: 0.5px; }
  </style>
  <defs>
  <radialGradient id="glow" cx="50%" cy="0%" r="80%" fx="50%" fy="0%">
  <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.3"/>
  <stop offset="100%" stop-color="#3f3f46" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#ffffff"/>
  <stop offset="40%" stop-color="#d4d4d8"/>
  <stop offset="100%" stop-color="#71717a"/>
  </linearGradient>
  </defs>
  <rect width="800" height="228" rx="12" fill="url(#glow)"/>
  <g transform="translate(38, 40)">
  <rect width="56" height="56" rx="12" fill="#09090b" stroke="#27272a"/>
  <path d="M18 16 L28 40 L38 16" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M23 16 L28 28 L33 16" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="28" cy="40" r="2.5" fill="#c9d1d9"/>
  </g>
  <text x="114" y="70" class="sans name">Vaibhav Goel</text>
  <text x="117" y="94" class="mono role">SOFTWARE ENGINEER · INTELLIGENT SYSTEMS</text>
  <text x="117" y="130" class="sans tagline">I build production-grade systems at the intersection of machine</text>
  <text x="117" y="152" class="sans tagline">learning, distributed engineering, and frontend architecture.</text>
  <g transform="translate(117, 176)">
  <rect x="0" width="97" height="24" rx="4" class="chip"/><circle cx="12" cy="12" r="3" fill="#3178c6"/><text x="22" y="15.5" class="mono chip-text">TYPESCRIPT</text><rect x="107" width="71" height="24" rx="4" class="chip"/><circle cx="119" cy="12" r="3" fill="#3572a5"/><text x="129" y="15.5" class="mono chip-text">PYTHON</text><rect x="188" width="64" height="24" rx="4" class="chip"/><circle cx="200" cy="12" r="3" fill="#61dafb"/><text x="210" y="15.5" class="mono chip-text">REACT</text><rect x="262" width="78" height="24" rx="4" class="chip"/><circle cx="274" cy="12" r="3" fill="#009688"/><text x="284" y="15.5" class="mono chip-text">FASTAPI</text><rect x="350" width="78" height="24" rx="4" class="chip"/><circle cx="362" cy="12" r="3" fill="#ee4c2c"/><text x="372" y="15.5" class="mono chip-text">PYTORCH</text>
  </g>
  <g transform="translate(590, 40)" opacity="0.6" fill="none" stroke-width="1.5" stroke-linecap="round">
  <path stroke="#52525b">
  <animate attributeName="d" dur="8s" repeatCount="indefinite"
  values="M 0 100 C 40 100, 60 30, 100 30 C 140 30, 160 120, 200 120;M 0 100 C 40 100, 60 80, 100 80 C 140 80, 160 50, 200 50;M 0 100 C 40 100, 60 30, 100 30 C 140 30, 160 120, 200 120"/>
  </path>
  <path stroke="#3f3f46">
  <animate attributeName="d" dur="6s" repeatCount="indefinite"
  values="M 0 100 C 40 100, 60 60, 100 60 C 140 60, 160 90, 200 90;M 0 100 C 40 100, 60 120, 100 120 C 140 120, 160 40, 200 40;M 0 100 C 40 100, 60 60, 100 60 C 140 60, 160 90, 200 90"/>
  </path>
  <circle r="3" fill="#e4e4e7" stroke="none">
  <animateMotion dur="8s" repeatCount="indefinite" path="M 0 100 C 40 100, 60 30, 100 30 C 140 30, 160 120, 200 120"/>
  <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>
  </g>
</svg>
