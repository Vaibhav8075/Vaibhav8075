<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 196" width="400" height="196">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    .card { fill: none; stroke: #30363d; }
    .icon-box { fill: #161b22; stroke: #30363d; }
    .icon { fill: none; stroke: #f0f6fc; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .title { font-size: 17px; font-weight: 600; fill: #f0f6fc; }
    .kind { font-size: 10px; fill: #f0883e; letter-spacing: 1.5px; font-weight: 600; }
    .index { font-size: 10px; fill: #8b949e; letter-spacing: 1px; }
    .desc { font-size: 13px; fill: #8b949e; }
    .tag { font-size: 11px; fill: #8b949e; }
    .arrow { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <g transform="translate(8, 8)">
  <rect x="0.5" y="0.5" width="383" height="179" rx="10" class="card"/>
  <rect x="24" y="24" width="32" height="32" rx="6" class="icon-box"/>
  <path d="M30 31 H50 V49 H30 Z M30 46 L37 39 L42 44 L45 41 L50 46" class="icon"/>
  <text x="72" y="39" class="sans title">Little World</text>
  <text x="72" y="56" class="mono kind">LOCAL-FIRST WEB APP</text>
  <text x="360" y="36" text-anchor="end" class="mono index">05/06</text>
  <text x="24" y="92" class="sans desc">A private photo journal for two. Offline-first on</text>
  <text x="24" y="112" class="sans desc">IndexedDB and synced between devices through a</text>
  <text x="24" y="132" class="sans desc">Google Drive you own.</text>
  <circle cx="28" cy="152" r="4" fill="#3178c6"/><text x="38" y="156" class="mono tag">TypeScript</text><circle cx="126" cy="152" r="4" fill="#61dafb"/><text x="136" y="156" class="mono tag">React</text><circle cx="191" cy="152" r="4" fill="#646cff"/><text x="201" y="156" class="mono tag">Vite</text>
  <path d="M350 158 L360 148 M352.5 148 H360 V155.5" class="arrow"/>
  </g>
</svg>
