    .title { font-size: 18px; font-weight: 600; fill: #f0f6fc; }
    .kind { font-size: 10px; fill: #4493f8; letter-spacing: 1.5px; font-weight: 700; }
    .index { font-size: 10px; fill: #8b949e; letter-spacing: 1px; }
    .desc { font-size: 14px; fill: #8b949e; }
    .tag { font-size: 11px; fill: #8b949e; }
