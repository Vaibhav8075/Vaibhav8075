<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 196" width="400" height="196">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    .card { fill: none; stroke: #30363d; }
    .icon-box { fill: #161b22; stroke: #30363d; }
    .icon { fill: none; stroke: #f0f6fc; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .title { font-size: 17px; font-weight: 600; fill: #f0f6fc; }
    .kind { font-size: 10px; fill: #8b949e; letter-spacing: 1.5px; font-weight: 600; }
    .index { font-size: 10px; fill: #8b949e; letter-spacing: 1px; }
    .desc { font-size: 13px; fill: #8b949e; }
    .tag { font-size: 11px; fill: #8b949e; }
    .arrow { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <g transform="translate(8, 8)">
  <rect x="0.5" y="0.5" width="383" height="179" rx="10" class="card"/>
  <rect x="24" y="24" width="32" height="32" rx="6" class="icon-box"/>
  <path d="M30 49 L37 31 M50 49 L43 31 M40 49 V45 M40 41 V38 M40 35 V33" class="icon"/>
  <text x="72" y="39" class="sans title">Semantic Segmentation</text>
  <text x="72" y="56" class="mono kind">COMPUTER VISION</text>
  <text x="360" y="36" text-anchor="end" class="mono index">02/05</text>
  <text x="24" y="92" class="sans desc">Cityscapes road scenes labelled pixel by pixel into 7</text>
  <text x="24" y="112" class="sans desc">classes, with U-Net, ResNet50-UNet, DeepLabV3+</text>
  <text x="24" y="132" class="sans desc">and SegFormer built in PyTorch.</text>
  <circle cx="28" cy="152" r="4" fill="#3572a5"/><text x="38" y="156" class="mono tag">Python</text><circle cx="100" cy="152" r="4" fill="#8b949e"/><text x="110" y="156" class="mono tag">PyTorch</text><circle cx="178" cy="152" r="4" fill="#8b949e"/><text x="188" y="156" class="mono tag">ONNX</text>
  <path d="M350 158 L360 148 M352.5 148 H360 V155.5" class="arrow"/>
  </g>
</svg>
