<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #050505; }
      .section-title { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #71717a; letter-spacing: 3px; }
      
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #f4f4f5; }
      .company { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #a1a1aa; }
      .date { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #71717a; text-anchor: end; }
      
      .line { fill: none; stroke: #27272a; stroke-width: 2; }
      .dot { fill: #18181b; stroke: #52525b; stroke-width: 2; }
      .dot-active { fill: #e4e4e7; stroke: #e4e4e7; stroke-width: 2; }
      .pulse {
        animation: pulse 4s infinite ease-in-out;
      }
      @keyframes pulse {
        0% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
        100% { opacity: 0.5; transform: scale(1); }
      }
    </style>
  </defs>

  <rect width="800" height="350" class="bg" />

  <!-- Section Title -->
  <text x="40" y="30" class="section-title">EXPERIENCE</text>

  <!-- Timeline Line -->
  <path d="M 50 60 L 50 300" class="line" />

  <!-- Role 1 -->
  <g transform="translate(0, 70)">
    <circle cx="50" cy="5" r="5" class="dot-active pulse" style="transform-origin: 50px 5px;" />
    <text x="75" y="10" class="title">Software Engineering Intern <tspan class="company">at DCM Shriram Ltd.</tspan></text>
    <text x="760" y="10" class="date">2026.05 - 2026.07</text>
  </g>

  <!-- Role 2 -->
  <g transform="translate(0, 140)">
    <circle cx="50" cy="5" r="5" class="dot" />
    <text x="75" y="10" class="title">Frontend Developer <tspan class="company">at MossX</tspan></text>
    <text x="760" y="10" class="date">2025.06 - Present</text>
  </g>

  <!-- Role 3 -->
  <g transform="translate(0, 210)">
    <circle cx="50" cy="5" r="5" class="dot" />
    <text x="75" y="10" class="title">Frontend Developer Intern <tspan class="company">at Aarvasa</tspan></text>
    <text x="760" y="10" class="date">2026.01 - 2026.05</text>
  </g>

  <!-- Role 4 -->
  <g transform="translate(0, 280)">
    <circle cx="50" cy="5" r="5" class="dot" />
    <text x="75" y="10" class="title">Software Division <tspan class="company">at Team Sammard (VIT Rocketry)</tspan></text>
    <text x="760" y="10" class="date">2025.05 - 2025.10</text>
  </g>

</svg>
