<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Perfect match to header.svg) -->
    <radialGradient id="spotlight" cx="50%" cy="0%" r="80%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#111" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>

    <!-- Chrome Text Gradient -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <style>
      .bg { fill: url(#spotlight); stroke: none; rx: 12; }
      
      .label { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #71717a; letter-spacing: 3px; text-transform: uppercase; }
      
      .big-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 56px; font-weight: 600; fill: url(#chrome); letter-spacing: -2px; }
      .sub-label { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 9px; fill: #52525b; letter-spacing: 2px; text-transform: uppercase; }
      
      .stat-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 500; fill: #e4e4e7; }
      
      .lang-label { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 9px; fill: #a1a1aa; letter-spacing: 1px; text-transform: uppercase; }
      .bar-bg { fill: #111; rx: 2; }
      .bar-fg { fill: #52525b; rx: 2; }
      
      .divider { stroke: #27272a; stroke-width: 1; }
      
      .sync { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 9px; fill: #3f3f46; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Container -->
  <g transform="translate(40, 20)">
    <!-- Base Card -->
    <rect width="720" height="180" class="bg" />
    
    <!-- Outer Border to match Header -->
    <rect x="0.5" y="0.5" width="719" height="179" fill="none" stroke="#ffffff" stroke-opacity="0.05" rx="12"/>

    <!-- LEFT SECTION (Contributions) -->
    <text x="40" y="45" class="label">TELEMETRY</text>
    <text x="40" y="115" class="big-num">568</text>
    <text x="40" y="145" class="sub-label">CONTRIBUTIONS · PAST YEAR</text>

    <!-- Vertical Divider 1 -->
    <line x1="280" y1="40" x2="280" y2="140" class="divider" />

    <!-- MIDDLE SECTION (Stats) -->
    <g transform="translate(310, 0)">
      <!-- Stars -->
      <text x="0" y="60" class="stat-num">1</text>
      <text x="0" y="75" class="sub-label">STARS</text>

      <!-- Repositories -->
      <text x="0" y="115" class="stat-num">19</text>
      <text x="0" y="130" class="sub-label">REPOSITORIES</text>
      
      <!-- Followers -->
      <text x="120" y="60" class="stat-num">5</text>
      <text x="120" y="75" class="sub-label">FOLLOWERS</text>
    </g>

    <!-- Vertical Divider 2 -->
    <line x1="480" y1="40" x2="480" y2="140" class="divider" />

    <!-- RIGHT SECTION (Languages) -->
    <g transform="translate(510, 45)">
      <text x="0" y="0" class="label">LANGUAGES</text>
      
      <!-- Python -->
      <text x="0" y="25" class="lang-label">PYTHON</text>
      <rect x="0" y="32" width="160" height="4" class="bar-bg"/>
      <rect x="0" y="32" width="120" height="4" class="bar-fg" style="fill: #3b82f6;" />
      
      <!-- Jupyter -->
      <text x="0" y="55" class="lang-label">JUPYTER NOTEBOOK</text>
      <rect x="0" y="62" width="160" height="4" class="bar-bg"/>
      <rect x="0" y="62" width="100" height="4" class="bar-fg" style="fill: #eab308;" />
      
      <!-- TypeScript -->
      <text x="0" y="85" class="lang-label">TYPESCRIPT</text>
      <rect x="0" y="92" width="160" height="4" class="bar-bg"/>
      <rect x="0" y="92" width="30" height="4" class="bar-fg" style="fill: #14b8a6;" />
    </g>

    <!-- Sync Footer -->
    <text x="680" y="165" class="sync" text-anchor="end">SYNC 2026-09-17</text>
  </g>
</svg>
