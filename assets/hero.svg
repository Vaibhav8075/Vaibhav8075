<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Metallic Gradient for Name -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff">
        <animate attributeName="stop-color" values="#fff;#aaa;#fff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#888">
        <animate attributeName="stop-color" values="#888;#fff;#888" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#fff">
        <animate attributeName="stop-color" values="#fff;#aaa;#fff" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <style>
      .name {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 64px;
        letter-spacing: -2px;
        fill: url(#metal);
      }
      .title {
        font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
        font-size: 14px;
        fill: #666;
        letter-spacing: 4px;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #999;
        letter-spacing: 0px;
      }
      .dot {
        fill: #333;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" fill="url(#bgGrad)" rx="12" />
  
  <!-- Subtle border -->
  <rect x="1" y="1" width="798" height="248" fill="none" stroke="#ffffff" stroke-opacity="0.05" rx="12" />

  <!-- Center Content -->
  <g transform="translate(400, 100)" text-anchor="middle">
    <!-- Name -->
    <text x="0" y="0" class="name">Vaibhav Goel</text>
    
    <!-- Title -->
    <text x="0" y="45" class="title">SOFTWARE ENGINEER</text>
    
    <!-- Decorative Dots -->
    <circle cx="-130" cy="40" r="2" class="dot"/>
    <circle cx="130" cy="40" r="2" class="dot"/>
    
    <!-- Tagline -->
    <text x="0" y="85" class="tagline">Intelligent Systems &amp; Distributed Architecture.</text>
  </g>
</svg>
