<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.75" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>

    <!-- Chrome Gradient -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#777777"/>
    </linearGradient>

    <!-- Glass Node Gradient -->
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Connection Line -->
    <linearGradient id="conn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>

    <style>
      .text-primary { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 32px; fill: url(#chrome); }
      .text-secondary { font-family: "SF Mono", "JetBrains Mono", monospace; font-size: 11px; fill: #666; letter-spacing: 2px; }
      .text-tag { font-family: "SF Mono", "JetBrains Mono", monospace; font-size: 10px; fill: #888; }
      .typewriter {
        font-family: "SF Mono", "JetBrains Mono", monospace;
        font-size: 13px;
        fill: #999;
        white-space: pre;
      }
      .cursor {
        animation: blink 1s step-end infinite;
        fill: #fff;
        opacity: 0.7;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      .anim-line {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: drawLine 2s ease-out forwards;
      }
      .anim-line-delay {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: drawLine 2s ease-out 1s forwards;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#050505"/>
  <rect width="800" height="300" fill="url(#grid)"/>
  <rect width="800" height="300" fill="#050505" fill-opacity="0.3"/> <!-- Dim grid -->

  <!-- Border -->
  <rect x="0.5" y="0.5" width="799" height="299" fill="none" stroke="#ffffff" stroke-opacity="0.05" rx="8"/>

  <!-- Geometric V Favicon Graphic -->
  <g transform="translate(40, 40)">
    <rect width="32" height="32" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
    <path d="M10 9 L16 23 L22 9" fill="none" stroke="#EAEAEA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13 9 L16 16 L19 9" fill="none" stroke="#888" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="23" r="1.5" fill="#EAEAEA"/>
  </g>

  <!-- Titles -->
  <text x="40" y="110" class="text-secondary">VAIBHAV_GOEL</text>
  <text x="38" y="145" class="text-primary">Software Engineer</text>
  
  <text x="40" y="175" class="typewriter">I build high-performance data pipelines &amp; multi-agent systems.<tspan class="cursor">_</tspan></text>

  <!-- Tags -->
  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="70" height="20" rx="4" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="35" y="13" text-anchor="middle" class="text-tag">ML_SYS</text>
    
    <rect x="80" y="0" width="90" height="20" rx="4" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="125" y="13" text-anchor="middle" class="text-tag">DISTRIBUTED</text>

    <rect x="180" y="0" width="70" height="20" rx="4" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="215" y="13" text-anchor="middle" class="text-tag">FASTAPI</text>
  </g>

  <!-- Architectural Diagram (Right Side) -->
  <g transform="translate(450, 50)">
    
    <!-- Connections -->
    <path d="M40 100 L140 50 M40 100 L140 100 M40 100 L140 150" stroke="url(#conn)" stroke-width="1.5" fill="none" class="anim-line"/>
    <path d="M210 50 L300 100 M210 100 L300 100 M210 150 L300 100" stroke="url(#conn)" stroke-width="1.5" fill="none" stroke-dasharray="4 4" class="anim-line-delay"/>

    <!-- Left Node (Gateway) -->
    <rect x="0" y="80" width="40" height="40" rx="20" fill="url(#node)" stroke="#444" stroke-width="1.5"/>
    <text x="20" y="103" text-anchor="middle" class="text-tag" fill="#fff">API</text>

    <!-- Center Nodes (Agents) -->
    <rect x="140" y="30" width="70" height="40" rx="6" fill="url(#node)" stroke="#444" stroke-width="1.5"/>
    <text x="175" y="54" text-anchor="middle" class="text-tag" fill="#ccc">RISK</text>

    <rect x="140" y="80" width="70" height="40" rx="6" fill="url(#node)" stroke="#444" stroke-width="1.5"/>
    <text x="175" y="104" text-anchor="middle" class="text-tag" fill="#ccc">FRAUD</text>

    <rect x="140" y="130" width="70" height="40" rx="6" fill="url(#node)" stroke="#444" stroke-width="1.5"/>
    <text x="175" y="154" text-anchor="middle" class="text-tag" fill="#ccc">CREDIT</text>

    <!-- Right Node (OS) -->
    <rect x="300" y="80" width="40" height="40" rx="4" fill="#0A0A0A" stroke="#666" stroke-width="1.5"/>
    <text x="320" y="103" text-anchor="middle" class="text-tag" fill="#fff">OS</text>

  </g>
</svg>
