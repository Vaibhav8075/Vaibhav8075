<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 40" width="150" height="40">
  <defs>
    <style>
      .btn { fill: transparent; stroke: #30363d; stroke-width: 1; rx: 6; }
      .text-light { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 10px; fill: #8b949e; letter-spacing: 1px; font-weight: 500;}
      .text-dark { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 10px; fill: #c9d1d9; letter-spacing: 1px; font-weight: 700; }
      .accent { fill: #21262d; rx: 4; stroke: #30363d; stroke-width: 1; }
    </style>
  </defs>
  
  <rect width="148" height="38" x="1" y="1" class="btn" />
  <text x="40" y="23" class="text-light" text-anchor="middle">LINKEDIN</text>
  
  <rect x="80" y="5" width="60" height="30" class="accent" />
