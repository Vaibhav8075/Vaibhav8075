<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 196" width="400" height="196">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    .card { fill: url(#wash); stroke: #d1d9e0; }
    .icon-box { fill: #7c3aed; fill-opacity: 0.12; stroke: #7c3aed; stroke-opacity: 0.4; }
    .icon { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-2px); } }
    .title { font-size: 17px; font-weight: 600; fill: #1f2328; }
    .kind { font-size: 10px; fill: #7c3aed; letter-spacing: 1.5px; }
    .desc { font-size: 13px; fill: #59636e; }
    .tag { font-size: 11px; fill: #59636e; }
    .arrow { fill: none; stroke: #7c3aed; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
  <radialGradient id="wash" cx="0" cy="0" r="1">
  <stop offset="0" stop-color="#7c3aed" stop-opacity="0.07"/>
  <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#7c3aed"/>
  <stop offset="1" stop-color="#2563eb"/>
  </linearGradient>
  </defs>
  <g transform="translate(8, 8)">
  <rect x="0.5" y="0.5" width="383" height="179" rx="12" class="card"/>
  <rect x="0" y="24" width="3" height="132" rx="1.5" fill="url(#edge)"/>
  <rect x="24" y="24" width="32" height="32" rx="8" class="icon-box"/>
  <path d="M30 44 L36 37 L41 41 L50 32" class="icon float"/>
  <text x="72" y="39" class="sans title">Agentic Ledger</text>
  <text x="72" y="56" class="mono kind">AI AGENTS · FINTECH</text>
  <text x="24" y="92" class="sans desc">Four Phinite OS agents for small merchants: catch</text>
  <text x="24" y="112" class="sans desc">spoofed payments in under 200 ms and approve</text>
  <text x="24" y="132" class="sans desc">micro-loans from an LSTM revenue forecast.</text>
  <circle cx="28" cy="152" r="4" fill="#3572a5"/><text x="38" y="156" class="mono tag">Python</text><circle cx="100" cy="152" r="4" fill="#ee4c2c"/><text x="110" y="156" class="mono tag">PyTorch</text><circle cx="178" cy="152" r="4" fill="#009688"/><text x="188" y="156" class="mono tag">FastAPI</text>
  <path d="M350 158 L360 148 M352.5 148 H360 V155.5" class="arrow"/>
  </g>
</svg>
