<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 196" width="400" height="196">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    .card { fill: none; stroke: #d1d9e0; }
    .icon-box { fill: #f6f8fa; stroke: #d1d9e0; }
    .icon { fill: none; stroke: #1f2328; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .title { font-size: 17px; font-weight: 600; fill: #1f2328; }
    .kind { font-size: 10px; fill: #59636e; letter-spacing: 1.5px; font-weight: 600; }
    .index { font-size: 10px; fill: #59636e; letter-spacing: 1px; }
    .desc { font-size: 13px; fill: #59636e; }
    .tag { font-size: 11px; fill: #59636e; }
    .arrow { fill: none; stroke: #59636e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <g transform="translate(8, 8)">
  <rect x="0.5" y="0.5" width="383" height="179" rx="10" class="card"/>
  <rect x="24" y="24" width="32" height="32" rx="6" class="icon-box"/>
