<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 196" width="400" height="196">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    .card { fill: none; stroke: #d1d9e0; }
    .icon-box { fill: #f6f8fa; stroke: #d1d9e0; }
    .icon { fill: none; stroke: #1f2328; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .title { font-size: 17px; font-weight: 600; fill: #1f2328; }
    .kind { font-size: 10px; fill: #59636e; letter-spacing: 1.5px; font-weight: 600; }
    .index { font-size: 10px; fill: #59636e; letter-spacing: 1px; }
    .desc { font-size: 13px; fill: #59636e; }
    .tag { font-size: 11px; fill: #59636e; }
    .arrow { fill: none; stroke: #59636e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <g transform="translate(8, 8)">
  <rect x="0.5" y="0.5" width="383" height="179" rx="10" class="card"/>
  <rect x="24" y="24" width="32" height="32" rx="6" class="icon-box"/>
  <path d="M29 40 C 33 30, 36 30, 40 40 S 47 50, 51 40" class="icon"/>
  <text x="72" y="39" class="sans title">Physics-Augmented 1D-CNN</text>
  <text x="72" y="56" class="mono kind">ML RESEARCH</text>
  <text x="360" y="36" text-anchor="end" class="mono index">01/05</text>
  <text x="24" y="92" class="sans desc">Leakage-controlled benchmark of 1D-CNN</text>
  <text x="24" y="112" class="sans desc">bearing-fault classifiers on CWRU and Paderborn.</text>
  <text x="24" y="132" class="sans desc">The protocol, not the architecture, decides the score.</text>
  <circle cx="28" cy="152" r="4" fill="#3572a5"/><text x="38" y="156" class="mono tag">Python</text><circle cx="100" cy="152" r="4" fill="#8b949e"/><text x="110" y="156" class="mono tag">PyTorch</text><circle cx="178" cy="152" r="4" fill="#3d6117"/><text x="188" y="156" class="mono tag">LaTeX</text>
  <path d="M350 158 L360 148 M352.5 148 H360 V155.5" class="arrow"/>
