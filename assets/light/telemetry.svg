<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="800" height="210">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    .panel { fill: #f6f8fa; stroke: #d1d9e0; }
    .label { font-size: 11px; fill: #59636e; letter-spacing: 3px; }
    .big { font-size: 60px; font-weight: 800; fill: #1f2328; letter-spacing: -2px; }
    .sub { font-size: 9px; fill: #59636e; letter-spacing: 2px; }
    .stat { font-size: 22px; font-weight: 700; fill: #1f2328; }
    .lang { font-size: 9px; fill: #59636e; letter-spacing: 1px; }
    .divider { stroke: #d1d9e0; }
  </style>
  <defs><clipPath id="bar"><rect width="218" height="6" rx="3"/></clipPath></defs>
  <g transform="translate(14, 10)">
  <rect x="0.5" y="0.5" width="771" height="189" rx="12" class="panel"/>
  <rect x="24" y="30" width="8" height="8" fill="#bc4c00"/>
  <text x="40" y="38" class="mono label">TELEMETRY</text>
  <text x="21" y="116" class="sans big">466</text>
  <text x="24" y="142" class="mono sub">CONTRIBUTIONS · PAST YEAR</text>
  <line x1="270" y1="30" x2="270" y2="160" class="divider"/>
  <g transform="translate(300, 66)">
  <text x="56" y="0" text-anchor="end" class="sans stat">2</text><text x="70" y="-2" class="mono sub">STARS</text>
  <text x="56" y="40" text-anchor="end" class="sans stat">21</text><text x="70" y="38" class="mono sub">REPOSITORIES</text>
  <text x="56" y="80" text-anchor="end" class="sans stat">6</text><text x="70" y="78" class="mono sub">FOLLOWERS</text>
  </g>
  <line x1="500" y1="30" x2="500" y2="160" class="divider"/>
  <g transform="translate(530, 38)">
  <text class="mono label">LANGUAGES</text>
  <g transform="translate(0, 14)" clip-path="url(#bar)"><rect x="0.0" width="72.8" height="6" fill="#f1e05a"/><rect x="74.8" width="71.2" height="6" fill="#3572a5"/><rect x="148.0" width="56.9" height="6" fill="#3178c6"/><rect x="206.9" width="8.0" height="6" fill="#f34b7d"/><rect x="216.9" width="1.1" height="6" fill="#d1d9e0"/></g>
  <g transform="translate(0, 14)"><circle cx="4" cy="22.5" r="3.5" fill="#f1e05a"/><text x="14" y="26" class="mono lang">JAVASCRIPT</text><text x="218" y="26" text-anchor="end" class="mono lang">34%</text><circle cx="4" cy="40.5" r="3.5" fill="#3572a5"/><text x="14" y="44" class="mono lang">PYTHON</text><text x="218" y="44" text-anchor="end" class="mono lang">34%</text><circle cx="4" cy="58.5" r="3.5" fill="#3178c6"/><text x="14" y="62" class="mono lang">TYPESCRIPT</text><text x="218" y="62" text-anchor="end" class="mono lang">27%</text><circle cx="4" cy="76.5" r="3.5" fill="#f34b7d"/><text x="14" y="80" class="mono lang">C++</text><text x="218" y="80" text-anchor="end" class="mono lang">5%</text></g>
  </g>
  <circle cx="614.2" cy="168.5" r="2.5" fill="#1a7f37"/>
  <text x="748" y="172" text-anchor="end" class="mono sub">SYNCED 2026-10-10</text>
  </g>
