name: Build profile

on:
  schedule:
    - cron: "0 */12 * * *" # refresh stats every 12 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/profile.json
      - scripts/**

permissions:
  contents: write

concurrency:
  group: build-profile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # not the triggering SHA, so a queued run can still push

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitHub stats
        if: github.event_name != 'push'
        # Stats feed the cards; the calendar and repository data feed the live 3D page in docs/.
        # The Blender renders are snapshots and are only refreshed by re-rendering locally.
        run: |
          python scripts/update_telemetry.py
          python scripts/fetch_contributions.py
          python scripts/fetch_repos.py
        env:
          GITHUB_TOKEN: ${{ secrets.PAT || github.token }}

      - name: Render README and cards
        run: python scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data docs
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
